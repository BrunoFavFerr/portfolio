<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>???</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #ff6a00;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      text-shadow:
        0 0 10px #ff6a00,
        0 0 30px #ff4500;
    }
  </style>
</head>

<body
  class="min-vh-100 d-flex justify-content-center align-items-center text-center"
  style="
    background-image: url('image.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  "
>

<script>
  const style = document.createElement("style");

  style.innerHTML = `
    body {
      animation: glitch 0.15s infinite;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }

    body::before {
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 4px,
        rgba(255, 90, 0, 0.15) 5px,
        transparent 7px
      );
      animation: scanlines 0.12s linear infinite;
    }

    body::after {
      background: rgba(255, 80, 0, 0.08);
      animation: flash 0.2s infinite alternate;
    }

    @keyframes glitch {
      0% {
        transform: translate(0);
        filter: none;
      }

      20% {
        transform: translate(-3px, 2px);
        filter: saturate(2) contrast(1.3);
      }

      40% {
        transform: translate(3px, -2px);
        filter: sepia(0.5) saturate(3);
      }

      60% {
        transform: translate(-2px, 1px);
        filter: contrast(1.8);
      }

      80% {
        transform: translate(2px, -1px);
        filter: saturate(4);
      }

      100% {
        transform: translate(0);
        filter: none;
      }
    }

    @keyframes scanlines {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(10px);
      }
    }

    @keyframes flash {
      from {
        opacity: 0.05;
      }

      to {
        opacity: 0.35;
      }
    }
  `;

  document.head.appendChild(style);
</script>
<script>
  const mensagens = [
    "VOCÊ NÃO DEVERIA ESTAR AQUI",
    "ACESSO DETECTADO",
    "QUEM É VOCÊ?",
    "ERRO 1102",
    "NÃO OLHE PARA TRÁS",
    "CONEXÃO INSTÁVEL",
    "VOCÊ ENCONTROU O SEGREDO",
    "SISTEMA COMPROMETIDO",
    "NÍVEL SECRETO",
    "NÃO CONTE PARA NINGUÉM",
    "ESTAMOS OBSERVANDO",
    "ACESSO NÃO AUTORIZADO",
    "VOCÊ FOI AVISADO",
    "???",
    "1102"
  ];

  function criarMensagem() {
    const mensagem = document.createElement("div");

    mensagem.textContent =
      mensagens[Math.floor(Math.random() * mensagens.length)];

    mensagem.style.position = "fixed";
    mensagem.style.left = Math.random() * 85 + "vw";
    mensagem.style.top = Math.random() * 85 + "vh";
    mensagem.style.color = "#ff6a00";
    mensagem.style.fontFamily = "monospace";
    mensagem.style.fontWeight = "bold";
    mensagem.style.fontSize = (Math.random() * 60 + 40) + "px";
    mensagem.style.textShadow = `
      0 0 5px #ff6a00,
      0 0 15px #ff4500
    `;
    mensagem.style.zIndex = "10000";
    mensagem.style.pointerEvents = "none";

    document.body.appendChild(mensagem);

    // Pequeno glitch individual
    mensagem.animate([
      {
        opacity: 0,
        transform: "translateX(-10px) skewX(20deg)"
      },
      {
        opacity: 1,
        transform: "translateX(5px) skewX(-10deg)"
      },
      {
        opacity: 0.8,
        transform: "translateX(-3px)"
      },
      {
        opacity: 0,
        transform: "translateX(10px) skewX(15deg)"
      }
    ], {
      duration: Math.random() * 1200 + 800,
      easing: "steps(3)"
    }).finished.then(() => {
      mensagem.remove();
    });
  }

  // Aparece uma mensagem em intervalos aleatórios
  function iniciarMensagens() {
    criarMensagem();

    const proxima = Math.random() * 1800 + 500;

    setTimeout(iniciarMensagens, proxima);
  }

  iniciarMensagens();
</script>
<script>
document.addEventListener("mousemove", (event) => {
  const rastro = document.createElement("div");

  rastro.style.position = "fixed";
  rastro.style.left = event.clientX + "px";
  rastro.style.top = event.clientY + "px";
  rastro.style.width = "8px";
  rastro.style.height = "8px";
  rastro.style.background = "#ff6a00";
  rastro.style.boxShadow = "0 0 15px #ff4500";
  rastro.style.pointerEvents = "none";
  rastro.style.zIndex = "99999";

  document.body.appendChild(rastro);

  rastro.animate([
    {
      opacity: 1,
      transform: "scale(1)"
    },
    {
      opacity: 0,
      transform: "scale(0)"
    }
  ], {
    duration: 500
  }).finished.then(() => {
    rastro.remove();
  });
});
</script>

</body>
